framework:
    secret: test
    test: true
    http_method_override: false
    handle_all_throwables: true
    php_errors: { log: true }
    form: { enabled: true, csrf_protection: false }
    validation: { enabled: true }
    lock: 'flock'
    router: { utf8: true }

doctrine:
    dbal:
        driver: pdo_sqlite
        memory: true
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/Entity'
                prefix: 'Dmytrof\ImportBundle\Tests\Functional\App\Entity'
            DmytrofImportBundle:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/../../../src/Entity'
                prefix: 'Dmytrof\ImportBundle\Entity'

monolog:
    handlers:
        main: { type: 'null' }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Dmytrof\ImportBundle\Tests\Functional\App\:
        resource: '../'
        exclude: '../{Entity,config,data,TestKernel.php}'

    Dmytrof\ImportBundle\Tests\Functional\App\Manager\ProductManager:
        public: true
